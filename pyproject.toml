[project]
name = "marginal-utility-police-force"
version = "0.1.0"
description = "Causal Analysis of Police Spending on Violent Crime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "modin[ray]>=0.30.0",
    "ray>=2.40.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "networkx>=3.3",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
]
